spring.application.name=login-basico

# Banco H2 em arquivo (os dados ficam em ./data e sobrevivem ao reiniciar a aplicação)
spring.datasource.url=jdbc:h2:file:./data/loginbasico
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Console web do H2 para conferir o hash salvo: http://localhost:8080/h2-console
spring.h2.console.enabled=true
